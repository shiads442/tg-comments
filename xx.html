<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    textarea { width: 100%; height: 100px; box-sizing: border-box; margin-bottom: 12px; padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
    button { width: 100%; padding: 12px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h3>Залишити приватний коментар</h3>
  <textarea id="comment" placeholder="Ваш коментар побачать лише автори..."></textarea>
  <button onclick="sendComment()">Надіслати</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function sendComment() {
      const text = document.getElementById('comment').value;
      if (!text.trim()) return;

      // Передаємо дані назад у бот
      tg.sendData(JSON.stringify({
        action: "send_comment",
        text: text
      }));
      tg.close();
    }
  </script>
</body>
</html>
